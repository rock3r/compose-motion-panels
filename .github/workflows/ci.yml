name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Compile, test, and validate publications
        run: ./gradlew :androidApp:assembleDebug :panels:check :panels-jewel:check :panels-jewel-standalone:check publishToMavenLocal

  spectre:
    name: Spectre desktop E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install desktop recording codecs
        run: sudo apt-get update && sudo apt-get install -y gstreamer1.0-tools gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - name: Run Spectre desktop E2E
        run: xvfb-run -a -s '-screen 0 1440x900x24' ./gradlew :demo:spectreTest
      - name: Upload Spectre reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectre-reports
          path: demo/build/reports/
